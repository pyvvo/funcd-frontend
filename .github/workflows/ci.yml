name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

# pull-requests:read lets paths-filter list a PR's changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A change that touches no code (only Markdown or LICENSE) skips the ci job. A skipped
  # required job still reports success, so a docs-only PR is not blocked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      nonrelease: ${{ steps.filter.outputs.nonrelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
            # Anything a release PR does not touch.
            nonrelease:
              - '**'
              - '!CHANGELOG.md'
              - '!version.txt'
              - '!.release-please-manifest.json'
              - '!packages/ui/package.json'

  # release-please's PR only bumps the version and the changelog of an already checked main,
  # so it skips the ci job on the PR and in the merge queue. A release branch that touches
  # any other file still runs it.
  ci:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      !(needs.changes.outputs.nonrelease == 'false' &&
      (github.head_ref == 'release-please--branches--main' ||
      startsWith(github.event.merge_group.head_commit.message, 'chore(main): release')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Yarn itself comes from the repo (.yarn/releases, pinned by packageManager).
      - name: Enable Corepack
        run: corepack enable

      - uses: extractions/setup-just@v4

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Run CI (install, format, lint, typecheck, build)
        run: just ci
