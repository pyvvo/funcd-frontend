name: release-please

on:
  push:
    branches:
      - main
  # Publishes an existing release again, when its publish-npm job failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows, so its required checks never run and
      # the merge queue refuses it. A token from the funcd release GitHub App does trigger them.
      # Until the app is configured, release-please falls back to GITHUB_TOKEN.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing (OIDC): no token is stored, and npm attaches a provenance attestation.
  # The trusted publisher on npmjs.com names this workflow file and the npm environment.
  publish-npm:
    needs: release-please
    # On a manual run release-please is skipped, so this runs when it was not cancelled.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # Node 24 ships npm 11, which trusted publishing needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      # Through the root `ui` script, like CI: it puts the root's binaries (`vp`) on the PATH.
      - name: Build and pack @funcd-dev/ui and @funcd-dev/lib
        run: |
          yarn install --immutable
          yarn ui build
          yarn ui pack --out "$RUNNER_TEMP/ui.tgz"
          yarn lib build
          yarn lib pack --out "$RUNNER_TEMP/lib.tgz"

      - name: Publish to npm
        run: |
          npm publish "$RUNNER_TEMP/ui.tgz" --access public
          npm publish "$RUNNER_TEMP/lib.tgz" --access public
